<section class="workspace">

    <div class="translation-grid">

        <!-- ================= INPUT PANEL =================
             The three action cards below are <div> wrappers holding decorative
             spans. The real <button class="action-hit"> is stretched over the
             whole card and is kept CHILDLESS on purpose: the icon and the
             label are drawn by the sibling spans, and the button's own text is
             rendered at font-size:0, so it must not be used to carry either.
             js/voice.js and js/clipboard.js both report a message through the
             card's .action-desc instead - see the note in js/voice.js.
             Do not move the icon/title/desc into the button. -->
        <div class="translation-card">

            <div class="card-header">
                <span class="card-title">Your words</span>
                <span class="detected" id="detectedText">English selected</span>
            </div>

            <!-- aria-describedby is here rather than added by js, because the
                 relationship between the field and its message does not depend
                 on whether the message is currently showing - it points at an
                 empty, hidden element in the resting state, which describes
                 nothing. -->
            <textarea id="inputText" maxlength="1000" aria-label="Text to translate"
                      aria-describedby="inputNote" placeholder="Type your text here..."></textarea>

            <!-- js/translator.js fills this in when Translate is pressed with an
                 empty or whitespace-only box, and empties it again the moment
                 there is something to translate.

                 It sits under the field rather than in the output panel: the
                 complaint belongs next to the box that caused it, and a valid
                 translation already on screen should not be overwritten by a
                 note about the input.

                 aria-invalid on the textarea plus this id is the whole
                 accessible half. Focus returns to the textarea on failure, so
                 the message is announced with the field it describes - which
                 works without a live region, and cannot double up with one.
                 The [hidden] attribute is load-bearing: .input-note sets
                 display, which would otherwise beat the user-agent [hidden]
                 rule, exactly like .region-off-note and .ghost-btn. -->
            <p class="input-note" id="inputNote" hidden></p>

            <div class="card-foot">
                <span class="counter" id="counter">0 / 1000</span>

                <!-- clearBtn is never touched by JS, so it may hold real children -->
                <button class="ghost-btn" id="clearBtn" type="button" title="Clear text">
                    <span aria-hidden="true">×</span>
                    Clear
                </button>
            </div>

        </div>

        <!-- ================= OUTPUT PANEL ================= -->
        <div class="translation-card">

            <div class="card-header">
                <span class="card-title">Translation</span>
                <!-- The arrow is a child so it survives the label swap, and the
                     label lives in its own span because js/clipboard.js
                     rewrites it to "Shared" / "Failed" / "Nothing yet". Setting
                     textContent on the button itself would delete the arrow. -->
                <button class="ghost-btn" id="shareBtn" type="button" title="Share translation">
                    <span aria-hidden="true">↗</span>
                    <span class="ghost-btn-label">Share</span>
                </button>
            </div>

            <!-- translator.js replaces this element's contents with either the
                 translation text, a .output-placeholder, or an .output-empty
                 block when the phrase is outside the bundled set. js/voice.js,
                 js/clipboard.js and js/nav.js all look for those two classes to
                 tell a real result from the rest, so they must keep existing in
                 translator.css. -->
            <div class="output-area" id="outputText" aria-live="polite">
                <span class="output-placeholder">Translation will appear here...</span>
            </div>

            <div class="card-foot">
                <!-- #regionalIndicatorText is rewritten by js/translator.js to
                     "Regional Translation" or "Standard Translation", so the
                     states read as one pair. It says Standard whenever no
                     variant is actually returned: the switch off, Standard
                     Hindi selected, or a target language that takes no regional
                     flavour - which is the state a swap lands in. The dot keeps
                     its own class: it was originally a bare "> span" selector,
                     which turned this label into a second 6px cyan dot the
                     moment it became a span. -->
                <span class="regional-indicator"><span class="regional-dot" aria-hidden="true"></span><span id="regionalIndicatorText">Regional Translation</span></span>
            </div>

        </div>

    </div>

    <!-- ================= TRANSLATE =================
         #translateLabel is what js/translator.js rewrites ("Translating..." then
         back to "Translate with VaaniX"), so the arrow lives outside it. -->
    <div class="translate-row">
        <button class="translate-btn" id="translateBtn" type="button">
            <span id="translateLabel">Translate</span>
            <span class="translate-arrow" aria-hidden="true">→</span>
        </button>
    </div>

    <!-- ================= ACTION CARDS ================= -->
    <div class="action-row">

        <!-- Voice input -->
        <div class="action-card">
            <span class="action-icon" aria-hidden="true">🎙</span>
            <span class="action-text">
                <span class="action-title">Voice Input</span>
                <span class="action-desc">Speak to translate</span>
            </span>
            <button class="action-hit" id="micBtn" type="button" title="Speak to translate" aria-label="Voice input">🎙</button>
        </div>

        <!-- Copy -->
        <div class="action-card">
            <span class="action-icon" aria-hidden="true">⧉</span>
            <span class="action-text">
                <span class="action-title">Copy</span>
                <span class="action-desc">Copy to clipboard</span>
            </span>
            <button class="action-hit" id="copyBtn" type="button" title="Copy translation" aria-label="Copy translation">⧉</button>
        </div>

        <!-- Listen -->
        <div class="action-card">
            <span class="action-icon" aria-hidden="true">🔊</span>
            <span class="action-text">
                <span class="action-title">Listen</span>
                <span class="action-desc">Hear the translation</span>
            </span>
            <button class="action-hit" id="speakBtn" type="button" title="Listen to translation" aria-label="Listen to translation">🔊</button>
        </div>

    </div>

</section>
