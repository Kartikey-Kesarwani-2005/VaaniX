<section class="region-panel">

    <header class="region-panel-head">
        <h2 class="panel-title">Regional Mode</h2>
        <p class="panel-sub">Get translations in your local dialect and region-specific tone.</p>
    </header>

    <!--
        regionalToggle: js/translator.js dims this card to 0.45 opacity while the
        switch is off, and restores it when it is on. The dimming tracks the
        switch, not the result: with Regional mode on the card is fully
        available even while Standard Hindi is the selected region.
    -->
    <div class="region-toggle-control">
        <span class="region-toggle-label">Regional mode</span>

        <label class="switch">
            <input
                type="checkbox"
                id="regionalToggle"
                aria-label="Regional mode"
                checked
            >
            <span class="slider" aria-hidden="true"></span>
        </label>
    </div>

    <!--
        Shown whenever no regional variant is actually being returned, which is
        either of two states: the switch is off, or the switch is on but Standard
        Hindi is the selected region. The text is written by js/translator.js,
        which picks the wording that fits the reason; the markup here is the
        starting text for the switch-off case.

        While the switch is off this note also explains why the region select
        below is disabled and forced to Standard Hindi, and that the user's own
        region is kept and restored when the switch comes back on.
    -->
    <p class="region-off-note" id="regionOffNote" hidden>
        Regional flavour is off, so translations come back in Standard Hindi.
        Your region is kept and applies again the moment you switch it back on.
    </p>

</section>
