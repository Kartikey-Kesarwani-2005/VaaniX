<section class="region-panel">

    <header class="region-panel-head">
        <h2 class="panel-title">Regional Mode</h2>
        <p class="panel-sub">Get translations in your local dialect and region-specific tone.</p>
    </header>

    <!-- regionalToggle: js/translator.js dims #intelligenceText to 0.45 opacity
         when this is unchecked. That behaviour is untouched. -->
    <div class="region-toggle-control">
        <span class="region-toggle-label">Regional mode</span>

        <label class="switch">
            <input
                type="checkbox"
                id="regionalToggle"
                aria-label="Regional mode"
                checked
            >
            <span class="slider" aria-hidden="true"></span>
        </label>
    </div>

</section>
