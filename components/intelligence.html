<section class="region-panel">

    <header class="region-panel-head">
        <h2 class="panel-title">Regional Mode</h2>
        <p class="panel-sub">Get translations in your local dialect and region-specific tone.</p>
    </header>

<!--
        regionalToggle: js/translator.js adds .is-inactive to #intelligenceText
        whenever the region cannot reach the output - the switch being off, or
        the target language being one that takes no regional flavour, since every
        variant in the bundled table is a Hindi string. It removes it when
        Regional mode is on AND the target is Hindi, and stays fully available
        then even while Standard Hindi is the selected region.

        The dimming is two theme-aware colours, not an opacity: see
        css/intelligence.css.
    -->
    <div class="region-toggle-control">
        <span class="region-toggle-label">Regional mode</span>

        <label class="switch">
            <input
                type="checkbox"
                id="regionalToggle"
                aria-label="Regional mode"
                checked
            >
            <span class="slider" aria-hidden="true"></span>
        </label>
    </div>

    <!--
        Shown whenever no regional variant is actually being returned, which is
        any of three states: the switch is off, the switch is on but Standard
        Hindi is the selected region, or the target language is not Hindi. The
        text is written by js/translator.js, which picks the wording that fits
        the reason; the markup here is only the starting text for the switch-off
        case.

        The third state is the one a swap lands in - swapping English for Tamil
        makes Tamil the target, and no regional Tamil exists - so it gets its own
        sentence rather than silence.

        While the switch is off this note also explains why the region select
        below is disabled and forced to Standard Hindi, and that the user's own
        region is kept and restored when the switch comes back on. A non-Hindi
        target does NOT disable the picker: the region is still theirs, and it
        applies the moment the target is Hindi again.
    -->
    <p class="region-off-note" id="regionOffNote" hidden>
        Regional flavour is off, so translations come back in Standard Hindi.
        Your region is kept and applies again the moment you switch it back on.
    </p>

</section>
