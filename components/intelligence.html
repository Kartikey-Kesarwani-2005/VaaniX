<section class="region-panel">

    <header class="region-panel-head">
        <h2 class="panel-title">Regional Mode</h2>
        <p class="panel-sub">Get translations in your local dialect and region-specific tone.</p>
    </header>

    <!-- regionalToggle: js/translator.js dims #intelligenceText to 0.45 opacity
         when this is unchecked. That behaviour is untouched. -->
    <div class="region-toggle-control">
        <span class="region-toggle-label">Regional mode</span>

        <label class="switch">
            <input
                type="checkbox"
                id="regionalToggle"
                aria-label="Regional mode"
                checked
            >
            <span class="slider" aria-hidden="true"></span>
        </label>
    </div>

    <!--
        Shown only while #regionalToggle is off, so the Standard Hindi result is
        an explained choice rather than a bug report. The region <select> is left
        enabled on purpose: picking a region here is how a user sets it up for
        when they switch Regional mode back on. js/translator.js toggles `hidden`.
    -->
    <p class="region-off-note" id="regionOffNote" hidden>
        Regional flavour is off, so translations come back in Standard Hindi.
        Your region is kept and applies again the moment you switch it back on.
    </p>

</section>
