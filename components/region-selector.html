<section class="region-control">

    <div class="region-chip" aria-hidden="true">
        📍
    </div>


    <div class="region-copy">

        <span class="region-label">
            YOUR REGION
        </span>


        <select
            id="region"
            aria-label="Region"
        >

            <option value="prayagraj" selected>
                Prayagraj, Uttar Pradesh
            </option>

            <option value="standard">
                Standard Hindi
            </option>

            <option value="varanasi">
                Varanasi · Purvanchal
            </option>

            <option value="lucknow">
                Lucknow · Awadh
            </option>

            <option value="agra">
                Agra · Braj
            </option>

            <option value="patna">
                Patna · Bihar
            </option>

        </select>

    </div>


    <div class="region-hint">

        <span class="hint-dot"></span>

        Regional expressions enabled

    </div>

</section>
