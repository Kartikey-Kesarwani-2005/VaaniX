<section class="workspace-head">

    <div>
        <h1 class="workspace-title">Translation Workspace</h1>
        <p class="workspace-sub">Translate words into the way your region speaks.</p>
    </div>

    <div class="language-bar">
        <!-- FROM LANGUAGE -->
        <div class="language-selector">
            <span class="selector-label">From</span>
            <!--
                The list is written out here rather than generated from
                VAANIX_LANGUAGES in js/language-data.js, so the bar still renders if
                that file fails to load. Both lists must stay in step: an option
                value not in VAANIX_LANGUAGES cannot be looked up by
                js/translator.js and has no BCP-47 tag for js/voice.js.

                The five regional dialects (Bhojpuri, Maithili, Magahi, Awadhi,
                Braj) used to be listed here. They are not in VAANIX_LANGUAGES and
                are not offered as a translation language: a dialect is a flavour
                of Hindi rather than a separate language, so putting it in the
                upper bar would make this row mean two different things. They
                remain reachable as REGIONS through the region picker.

                Option text must stay on ONE line: js/language.js reads
                fromLanguage.options[i].text straight into #detectedText, so any
                newline inside the tag would be rendered there.
            -->
            <select id="fromLanguage" aria-label="From language">
                <option value="english" selected>🇬🇧 English</option>
                <option value="hindi">🇮🇳 Hindi</option>
                <option value="bengali">🇮🇳 Bengali</option>
                <option value="punjabi">🇮🇳 Punjabi</option>
                <option value="marathi">🇮🇳 Marathi</option>
                <option value="gujarati">🇮🇳 Gujarati</option>
                <option value="tamil">🇮🇳 Tamil</option>
                <option value="telugu">🇮🇳 Telugu</option>
                <option value="kannada">🇮🇳 Kannada</option>
                <option value="malayalam">🇮🇳 Malayalam</option>
                <option value="odia">🇮🇳 Odia</option>
                <option value="assamese">🇮🇳 Assamese</option>
                <option value="urdu">🇵🇰 Urdu</option>
            </select>
        </div>

        <!-- Swap button flips the two languages, and the two text areas with
             them: js/language.js moves the translation into the input and the
             source into the output, so neither box ends up labelled with a
             language its text is not in. With nothing translated it moves only
             the languages and puts the output placeholder back.

             It also dispatches a change event on both selects, which is how
             js/translator.js hears that the target moved - that is what makes
             the Regional Mode label and note correct straight after a swap.

             The aria-label says "and text" because that is what happens: the
             button moves the workspace, not only the two dropdowns. -->
        <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap languages and text">⇄</button>

        <!-- TO LANGUAGE -->
        <div class="language-selector">
            <span class="selector-label">To</span>
            <select id="toLanguage" aria-label="To language">
                <option value="hindi" selected>🇮🇳 Hindi</option>
                <option value="english">🇬🇧 English</option>
                <option value="bengali">🇮🇳 Bengali</option>
                <option value="punjabi">🇮🇳 Punjabi</option>
                <option value="marathi">🇮🇳 Marathi</option>
                <option value="gujarati">🇮🇳 Gujarati</option>
                <option value="tamil">🇮🇳 Tamil</option>
                <option value="telugu">🇮🇳 Telugu</option>
                <option value="kannada">🇮🇳 Kannada</option>
                <option value="malayalam">🇮🇳 Malayalam</option>
                <option value="odia">🇮🇳 Odia</option>
                <option value="assamese">🇮🇳 Assamese</option>
                <option value="urdu">🇵🇰 Urdu</option>
            </select>
        </div>
    </div>

</section>
