<!--
    Shared off-canvas panel used by the History and Settings sidebar actions.
    One panel with two modes rather than two panels, so the open/close
    behaviour, focus trap and Escape handling exist exactly once.

    There is no `hidden` attribute here on purpose: closed state is driven by
    `data-open` in css/drawer.css so the slide can transition. `visibility:
    hidden` is used instead of opacity because it also removes the panel's
    contents from the tab order while it is closed, which opacity does not.
-->
<div class="drawer-root" id="drawerRoot" data-open="false">

    <div class="drawer-overlay" id="drawerOverlay"></div>

    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">

        <header class="drawer-head">
            <div class="drawer-head-text">
                <h2 class="drawer-title" id="drawerTitle">History</h2>
                <p class="drawer-sub" id="drawerSub">This session only</p>
            </div>

            <!-- Shown only in history mode, where there is something to clear. -->
            <button class="ghost-btn drawer-clear" id="drawerClear" type="button" hidden>
                <span aria-hidden="true">×</span>
                Clear
            </button>

            <button class="drawer-close" id="drawerClose" type="button" aria-label="Close panel">
                <span aria-hidden="true">×</span>
            </button>
        </header>

        <!-- Filled by js/nav.js. Content is built with textContent, never
             innerHTML, because it echoes arbitrary user input. -->
        <div class="drawer-body" id="drawerBody"></div>

    </aside>
</div>
